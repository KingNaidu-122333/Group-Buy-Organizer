<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Confirmed • Group Buy Organizer</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<main class="container success-shell">
    <section class="success-card">
        <h1>Payment confirmed</h1>
        <p>Stripe has confirmed that your payment was successful for <strong th:text="${dealTitle}">your group deal</strong>.</p>
        <a class="primary-btn" th:href="@{/#deals}">Back to deals</a>
    </section>
</main>
</body>
</html>
