# Local profile is used by default. Render explicitly activates the prod profile.
spring.profiles.default=local

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.cookie.http-only=true

app.url=${APP_URL:http://localhost:8080}
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.email=${APP_ADMIN_EMAIL:admin@example.com}
app.admin.password=${APP_ADMIN_PASSWORD:}

stripe.secret.key=${STRIPE_SECRET_KEY:}
stripe.public.key=${STRIPE_PUBLIC_KEY:}
stripe.currency=${STRIPE_CURRENCY:usd}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
