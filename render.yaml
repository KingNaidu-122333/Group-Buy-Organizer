services:
  - type: web
    name: group-buy-organizer
    runtime: docker
    plan: free
    region: oregon
    branch: main
    envVars:
      - key: PORT
        value: 8080
      - key: APP_URL
        value: https://group-buy-organizer.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: group-buy-organizer-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: group-buy-organizer-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: group-buy-organizer-db
          property: password
      - key: DB_DRIVER
        value: org.postgresql.Driver
      - key: DB_DIALECT
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLIC_KEY
        sync: false
      - key: SPRING_PROFILES_ACTIVE
        value: prod

  - type: postgres
    name: group-buy-organizer-db
    plan: free
    region: oregon
