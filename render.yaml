services:
  - type: web
    name: group-buy-organizer
    runtime: docker
    plan: free
    region: oregon
    branch: main
    envVars:
      - key: PORT
        value: 8080
      - key: APP_URL
        value: https://group-buy-organizer.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: group-buy-organizer-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: group-buy-organizer-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: group-buy-organizer-db
          property: password
      - key: DB_DRIVER
        value: org.postgresql.Driver
      - key: DB_DIALECT
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLIC_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CURRENCY
        value: usd
      - key: APP_ADMIN_USERNAME
        value: admin
      - key: APP_ADMIN_EMAIL
        value: admin@example.com
      - key: APP_ADMIN_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: true
      - key: H2_CONSOLE_ENABLED
        value: false
      - key: DDL_AUTO
        value: update
      - key: SPRING_PROFILES_ACTIVE
        value: prod

  - type: postgres
    name: group-buy-organizer-db
    plan: free
    region: oregon
